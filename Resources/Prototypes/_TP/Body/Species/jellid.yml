## APPEARANCE ##
- type: entity
  parent: BaseSpeciesAppearance
  id: TP14AppearanceJellid
  suffix: Trieste
  categories: [ HideSpawnMenu ]
  name: Jellid appearance
  components:
  - type: Inventory
    speciesId: jellid # This is what controls custom textures for clothing.
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: TP14OrganJellidTorso
      Head: TP14OrganJellidHead
      ArmLeft: TP14OrganJellidArmLeft
      ArmRight: TP14OrganJellidArmRight
      HandRight: TP14OrganJellidHandRight
      HandLeft: TP14OrganJellidHandLeft
      LegLeft: TP14OrganJellidLegLeft
      LegRight: TP14OrganJellidLegRight
      FootLeft: TP14OrganJellidFootLeft
      FootRight: TP14OrganJellidFootRight
      Brain: TP14OrganJellidCore
      Eyes: TP14OrganJellidCore
      Lungs: TP14OrganJellidLungs
  - type: HumanoidProfile
    species: TP14SpeciesJellid

- type: entity
  parent:
  - TP14AppearanceJellid
  - BaseSpeciesMobOrganic
  id: TP14MobJellidPerson
  suffix: Trieste
  name: Urist McJellid
  components:
  - type: Speech
    speechVerb: Slime
    speechSounds: TP14SpeechSoundsJellid
    allowedEmotes: [ 'Squish' ]
  - type: TypingIndicator
    proto: TP14TypingIndicatorJellid
  - type: Vocal
    emoteSounds: TP14EmoteSoundsJellid
