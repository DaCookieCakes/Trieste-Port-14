- type: entity
  parent: PrefilledSyringe
  id: TP14SyringeReinforcementAlgae
  suffix: Trieste, reinforcement algae
  components:
  - type: Label
    currentLabel: reagent-name-reinforcement-algae
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
        - ReagentId: ReinforcementAlgae
          Quantity: 15

- type: entity
  parent: PrefilledSyringe
  id: TP14SyringeRegenerationAlgae
  suffix: Trieste, regeneration algae
  components:
  - type: Label
    currentLabel: reagent-name-regeneration-algae
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
        - ReagentId: RegenerationAlgae
          Quantity: 15

- type: entityTable
  id: TP14RandomSafeSyringeTable
  table: !type:GroupSelector
    children:
    - id: TP14SyringeReinforcementAlgae
    - id: TP14SyringeRegenerationAlgae
    - id: SyringeEphedrine
    - id: SyringeEthylredoxrazine
    - id: SyringeHyronalin
    - id: SyringeInaprovaline
    - id: SyringeIpecac
    - id: SyringePhalanximine
    - id: SyringeSaline
    - id: SyringeSigynate
    - id: SyringeTranexamicAcid
