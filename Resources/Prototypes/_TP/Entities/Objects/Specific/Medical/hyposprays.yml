- type: entity
  parent: ChemicalMedipen
  id: TP14BruteAutoInjector
  suffix: Trieste
  name: brute auto-injector
  description: A rapid dose of reinforcement algae and tranexamic acid, intended for combat applications.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#c73333"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#c73333"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: bicpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: bicpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: ReinforcementAlgae
          Quantity: 15
        - ReagentId: TranexamicAcid
          Quantity: 5

