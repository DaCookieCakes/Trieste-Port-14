## RANDOM ##
- type: entity
  parent: PillCanister
  id: TP14PillCanisterRandom
  suffix: Trieste, Random
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        children:
        - id: TP14PillOxySaline
          amount: &Range1to6 !type:RangeNumberSelector
            range: 1, 6
        - id: PillDylovene
          amount: *Range1to6
        - id: PillHyronalin
          amount: *Range1to6
        - id: PillPotassiumIodide
          amount: *Range1to6
        - id: PillIron
          amount: *Range1to6
        - id: PillCopper
          amount: *Range1to6
        - id: TP14PillLexodine
          amount: *Range1to6
        - id: TP14PillRegenerationAlgae
          amount: *Range1to6
        - id: PillTricordrazine
          amount: *Range1to6
        - id: PillReinforcementAlgae
          amount: *Range1to6
        - id: PillCharcoal
          amount: *Range1to6
        - id: PillAmbuzol
          weight: 0.75
          amount: *Range1to6
        - id: PillAmbuzolPlus
          weight: 0.75
          amount: *Range1to6
        - id: PillSpaceDrugs
          weight: 0.75
          amount: *Range1to6
        - id: StrangePill
          weight: 0.75
          amount: *Range1to6

# Entity Tables
- type: entityTable
  id: TP14RandomSafePillTable
  table: !type:GroupSelector
    children:
    - id: TP14PillReinforcementAlgae
    - id: PillCharcoal
    - id: PillCopper
    - id: TP14PillRegenerationAlgae
    - id: TP14PillOxygenatedSaline
    - id: PillDylovene
    - id: PillHyronalin
    - id: PillIron
    - id: TP14PillLexodine
    - id: PillPotassiumIodide
    - id: PillTricordrazine
    - id: StrangePill
