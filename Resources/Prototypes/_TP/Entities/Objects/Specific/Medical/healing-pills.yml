## OXY-SALINE ##
- type: entity
  parent: Pill
  id: TP14PillOxySaline
  suffix: OxySaline 10u
  name: pill
  components:
  - type: Pill
    pillType: 15
  - type: Sprite
    state: pill16
  - type: Label
    currentLabel: oxysaline 10u
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: OxygenatedSaline
          Quantity: 10

- type: entity
  parent: PillCanister
  id: TP14PillCanisterOxySaline
  suffix: OxySaline 10u, 7
  name: pill canister
  components:
  - type: Label
    currentLabel: oxysaline 10u
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: TP14PillOxySaline
        amount: 7


