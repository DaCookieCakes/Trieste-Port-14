- type: entity
  id: TP14AtmosFixSeaWaterMarker
  parent: MarkerBase
  suffix: Trieste
  name: Atmos Fix SeaWater Marker
  description: "SeaWater @ gas miner pressure, T20C"
  components:
  - type: Sprite
    layers:
    - sprite: Markers/atmos.rsi # {
      state: base
      shader: unshaded
    - sprite: Markers/atmos.rsi
      shader: unshaded # }
      state: watervapour
  - type: AtmosFixMarker
    mode: 9

- type: entity
  id: TP14AtmosFixTrenchMarker
  parent: MarkerBase
  suffix: Trieste
  name: Atmos Fix Trench Marker
  description: "Trench @ extreme pressure, T20C"
  components:
  - type: Sprite
    layers:
    - sprite: Markers/atmos.rsi
      state: base-hot
      shader: unshaded
    - sprite: Markers/atmos.rsi
      shader: unshaded
      state: watervapour
  - type: AtmosFixMarker
    mode: 10
