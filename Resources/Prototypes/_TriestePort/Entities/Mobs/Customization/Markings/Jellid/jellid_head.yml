# CORES #
- type: marking
  id: TP14MarkingJellidCore
  bodyPart: Head
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  default:
    type:
      !type:EyeColoring
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/eyes.rsi
    state: jellid

- type: marking
  id: TP14MarkingJellidCrownCore
  bodyPart: Head
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  coloring:
    default:
      type:
        !type:EyeColoring
    layers:
      crown_secondary:
        type:
          !type:EyeColoring
          negative: true
      crown_tertiary:
        type:
          !type:EyeColoring
          negative: true
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/core.rsi
    state: crown_primary
  - sprite: _TriestePort/Mobs/Customization/Jellid/core.rsi
    state: crown_secondary
  - sprite: _TriestePort/Mobs/Customization/Jellid/core.rsi
    state: crown_tertiary

- type: marking
  id: TP14MarkingJellidTriCore
  bodyPart: Head
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  coloring:
    default:
      type:
        !type:EyeColoring
    layers:
      tri_secondary:
        type:
          !type:EyeColoring
          negative: true
      tri_tertiary:
        type:
          !type:EyeColoring
          negative: true
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/core.rsi
    state: tri_primary
  - sprite: _TriestePort/Mobs/Customization/Jellid/core.rsi
    state: tri_secondary
  - sprite: _TriestePort/Mobs/Customization/Jellid/core.rsi
    state: tri_tertiary

- type: marking
