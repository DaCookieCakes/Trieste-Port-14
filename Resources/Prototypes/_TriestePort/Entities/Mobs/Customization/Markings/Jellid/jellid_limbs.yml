# HANDS #
# gradients
- type: marking
  id: TP14MarkingJellidLeftHandGradient
  bodyPart: LHand
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/arms.rsi
    state: jellid_gradient_l_hand

- type: marking
  id: TP14MarkingJellidRightHandGradient
  bodyPart: RHand
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/arms.rsi
    state: jellid_gradient_r_hand

# spots
- type: marking
  id: TP14MarkingJellidLeftHandSpots
  bodyPart: LHand
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  coloring:
    default:
      type:
        !type:SimpleColoring
        color: "#FFFFFF"
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/arms.rsi
    state: jellid_spots_l_hand

- type: marking
  id: TP14MarkingJellidRightHandSpots
  bodyPart: RHand
  groupWhitelist: [ TP14MarkingsGroupJellid ]
  coloring:
    default:
      type:
        !type:SimpleColoring
        color: "#FFFFFF"
  sprites:
  - sprite: _TriestePort/Mobs/Customization/Jellid/arms.rsi
    state: jellid_spots_r_hand


