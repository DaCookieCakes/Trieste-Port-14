- type: entity
  id: TP14AbstractBellConsole
  parent: BaseStructure
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Animateable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Rotatable
  - type: Sprite
    drawdepth: Objects
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: generic
    - map: [ "computerLayerKeys" ]
      state: generic_keys
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 500
  - type: UIPowerState
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: ActivatableUI
    key: enum.BellUiKey.Key
  - type: UserInterface
    interfaces:
      enum.BellUiKey.Key:
        type: BellBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 3.0
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4" # shine from the top, not bottom of the computer
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: BellConsole

- type: entity
  parent: TP14AbstractBellConsole
  id: TP14DivingBellConsole
  name: diving bell console
  description: Lets you control the diving bell.
  suffix: Trieste, Diving Bell, Start
  components:
  - type: BellConsole
    dockTag: TP14TagDockBell
    platformWhitelist:
      components:
      - BellPlatform

- type: entity
  parent: TP14AbstractBellConsole
  id: TP14TrenchBellConsole
  name: trench bell console
  description: Operates the Trench exploration bell.
  suffix: Trieste, Trench-Bell, Start
  components:
  - type: BellConsole
    dockTag: TP14TagDockTrench
    platformWhitelist:
      components:
      - TrenchPlatform
