## CAGE LAMPS ##
# Basic lamps
- type: entity
  name: cage lamp
  id: TP14AbstractCageLamp
  abstract: true
  components:
  - type: Sprite
    sprite: _TriestePort/Structures/Wallmounts/Lighting/cage_lamp.rsi
  - type: Tag
    tags:
    - TP14TagWaterproof

- type: entity
  id: TP14CageLampAlwaysPowered
  parent: [ TP14AbstractCageLamp, SmallLight ]
  suffix: Trieste, Always Powered
  components:
  - type: Sprite
    state: base

- type: entity
  id: TP14CageLampEmpty
  parent: [ TP14AbstractCageLamp, PoweredSmallLightEmpty ]
  suffix: Trieste, Empty
  components:
  - type: Sprite
    state: empty

- type: entity
  id: TP14CageLampLED
  parent: [ TP14AbstractCageLamp, PoweredLEDSmallLight ]
  suffix: Trieste, LED
  components:
  - type: Sprite
    state: empty

- type: entity
  id: TP14CageLampDim
  parent: [ TP14AbstractCageLamp, PoweredDimSmallLight ]
  suffix: Trieste, Dim
  components:
  - type: Sprite
    state: empty

- type: entity
  id: TP14CageLampWarm
  parent: [ TP14AbstractCageLamp, PoweredWarmSmallLight ]
  suffix: Trieste, Warm
  components:
  - type: Sprite
    state: empty

- type: entity
  id: TP14CageLamp
  parent: [ TP14AbstractCageLamp, PoweredSmallLight ]
  suffix: Trieste
  components:
  - type: Sprite
    state: empty


## COLORED CAGE LAMPS ##
# I couldn't get "always powered" ones to work for some reason.

# Black
- type: entity
  id: TP14CageLampBlack
  parent: TP14CageLamp
  suffix: Trieste, Black
  components:
  - type: PoweredLight
    hasLampOnSpawn: LightBulbCrystalBlack
  - type: PointLight
    energy: 1.0
    radius: 6
    softness: 0.5
    color: "#363636"

