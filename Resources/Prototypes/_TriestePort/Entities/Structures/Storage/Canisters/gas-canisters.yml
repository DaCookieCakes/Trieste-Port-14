- type: entity
  parent: GasCanister
  id: TP14GasCanisterSeaWater
  name: water vapor canister
  description: A canister that can contain any type of gas. This one is supposed to contain water vapor. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    layers:
    - state: water_vapor
    - state: paper
      visible: false
      map: [ "enum.PaperLabelVisuals.Layer" ]
    - state: integrity-unshaded-0
      map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
      shader: unshaded
      visible: false
    - state: mask-water_vapor
      map: [ "enum.MaxPressureVisualLayers.Base" ]
      visible: false
  - type: MaxPressureVisuals
    integrityMask: mask-water_vapor
  - type: GasCanister
    air:
      volume: 1500
      moles:
        WaterVapor: 2769.36 # Water vapor
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          WaterVaporCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
