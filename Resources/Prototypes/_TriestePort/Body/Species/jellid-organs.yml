# BASE #
- type: entity
  parent: OrganBaseOrganic
  id: TP14OrganJellid
  abstract: true
  suffix: Jellid, Trieste

- type: entity
  id: TP14OrganJellidMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ TP14MetabolizerTypeJellid ]

- type: entity
  parent: TP14OrganJellid
  id: TP14OrganJellidInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _TriestePort/Mobs/Species/Jellid/organs.rsi

- type: entity
  parent: TP14OrganJellid
  id: TP14OrganJellidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _TriestePort/Mobs/Species/Jellid/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _TriestePort/Mobs/Species/Jellid/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: TP14MarkingsGroupJellid


# EXTERNAL #
- type: entity
  parent: [ OrganBaseTorso, TP14OrganJellidExternal ]
  id: TP14OrganJellidTorso

- type: entity
  parent: [ OrganBaseHead, TP14OrganJellidExternal ]
  id: TP14OrganJellidHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ OrganBaseArmLeft, TP14OrganJellidExternal ]
  id: TP14OrganJellidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, TP14OrganJellidExternal ]
  id: TP14OrganJellidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, TP14OrganJellidExternal ]
  id: TP14OrganJellidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, TP14OrganJellidExternal ]
  id: TP14OrganJellidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, TP14OrganJellidExternal ]
  id: TP14OrganJellidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, TP14OrganJellidExternal ]
  id: TP14OrganJellidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, TP14OrganJellidExternal ]
  id: TP14OrganJellidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, TP14OrganJellidExternal ]
  id: TP14OrganJellidFootRight


# INTERNAL #
- type: entity
  parent: [ OrganBaseBrain, TP14OrganJellidInternal ]
  id: TP14OrganJellidBrain

- type: entity
  parent: [ OrganBaseLungs, TP14OrganJellidInternal, TP14OrganJellidMetabolizer ]
  id: TP14OrganJellidLungs
  components:
  - type: Lung
    alert: TP14AlertPlasmolysis
