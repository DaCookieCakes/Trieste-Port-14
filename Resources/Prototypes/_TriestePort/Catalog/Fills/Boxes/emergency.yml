- type: entity
  parent: BoxSurvival
  id: TP14BoxSurvivalSeaWater
  suffix: Trieste, Standard H2O
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: TP14ClothingLungAdaptionApparatus
        - id: TP14ClothingGlovesJellidProof
        - id: PowerCellSmall
        - id: TP14EmergencyGasTankSeaWaterFilled
        - id: EmergencyMedipen
  - type: Sprite
    layers:
    - state: internals
    - state: seawatertank
  - type: Label
    currentLabel: reagent-name-sea-water

